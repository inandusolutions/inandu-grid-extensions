version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    ignore:
      # The bare package is referenced only by src/Inandu.Grid.Extensions.EntityFrameworkCore, where
      # its version is the minimum consumers must have (see the comment in that csproj). Bumping it
      # forces every consumer onto the new version — 8ed2abb moved .NET 8 apps from EF Core 8 to 9.
      # Raise it by hand when an advisory requires it. Test projects use the *.Sqlite package, which
      # is still updated by the group below.
      - dependency-name: Microsoft.EntityFrameworkCore
    groups:
      entity-framework-core:
        patterns:
          - Microsoft.EntityFrameworkCore*
      test-dependencies:
        patterns:
          - "xunit*"
          - Microsoft.NET.Test.Sdk
          - coverlet.*
          - FluentAssertions

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
