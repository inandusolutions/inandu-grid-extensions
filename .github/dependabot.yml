version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      entity-framework-core:
        patterns:
          - Microsoft.EntityFrameworkCore*
      test-dependencies:
        patterns:
          - "xunit*"
          - Microsoft.NET.Test.Sdk
          - coverlet.*
          - FluentAssertions

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
