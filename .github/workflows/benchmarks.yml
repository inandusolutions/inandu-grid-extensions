name: Benchmarks

# Manual only — BenchmarkDotNet numbers from a shared CI runner aren't comparable across runs or to
# real hardware, so this isn't wired to push/PR. It exists so anyone can trigger a reproducible run
# and inspect the results, not as a source of truth for the README's reference numbers (those are
# measured on real hardware — see benchmarks/README.md).

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "BenchmarkDotNet --filter glob(s), space-separated (default: everything)"
        required: false
        default: "*"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            8.x
            10.x

      - run: dotnet restore Inandu.Grid.Extensions.sln

      - name: Run benchmarks (short job)
        working-directory: benchmarks/Inandu.Grid.Extensions.Benchmarks
        env:
          # Passed through the environment, never interpolated into the script.
          BENCH_FILTER: ${{ inputs.filter }}
        run: |
          set -f   # the glob(s) go to BenchmarkDotNet as-is, not expanded by the shell
          dotnet run -c Release -f net8.0 -- --filter $BENCH_FILTER --job short --exporters json markdown

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-results
          path: benchmarks/Inandu.Grid.Extensions.Benchmarks/BenchmarkDotNet.Artifacts/
          retention-days: 30
