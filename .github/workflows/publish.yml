name: Publish to NuGet

# Packs the three packable projects and pushes them to nuget.org via trusted
# publishing (OIDC) — no long-lived API key.
#
# Runs on a pushed v* tag, or manually (Actions > Publish to NuGet > Run workflow)
# with the version typed in.
#
# One-time setup:
#   - nuget.org > Account > Trusted Publishing: add a policy —
#       Repository owner: inandusolutions
#       Repository:       inandu-grid-extensions
#       Workflow file:    publish.yml
#       Packages / glob:  Inandu.Grid.Extensions*
#   - GitHub > Settings > Secrets and variables > Actions > Variables:
#       NUGET_USER = the nuget.org account/org that owns the packages
#
# Release flow (see docs/publishing.md): bump <Version> in the three src/**/*.csproj,
# move the CHANGELOG notes, commit, then `git tag vX.Y.Z && git push --tags`
# (the tag must be cut from a commit that contains this file).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish — must match <Version> in the csprojs (e.g. 0.3.0)'
        required: true

permissions:
  contents: read
  id-token: write   # required for NuGet trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET (8 runtime + 10 SDK)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          CSPROJ_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/Inandu.Grid.Extensions/Inandu.Grid.Extensions.csproj)
          echo "publishing=$VERSION  csproj=$CSPROJ_VERSION"
          if [ "$VERSION" != "$CSPROJ_VERSION" ]; then
            echo "::error::Version $VERSION does not match <Version>$CSPROJ_VERSION in the core csproj — bump src/**/*.csproj first."
            exit 1
          fi

      - name: Restore
        run: dotnet restore Inandu.Grid.Extensions.sln

      - name: Build
        run: dotnet build Inandu.Grid.Extensions.sln -c Release --no-restore

      - name: Test (net8.0 + net10.0)
        run: dotnet test Inandu.Grid.Extensions.sln -c Release --no-build

      - name: Pack
        run: dotnet pack Inandu.Grid.Extensions.sln -c Release --no-build -o ./artifacts

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push (core first, then the companions)
        run: |
          for pkg in $(ls ./artifacts/*.nupkg | sort); do
            echo "pushing $pkg"
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
