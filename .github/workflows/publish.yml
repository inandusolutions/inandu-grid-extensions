name: Publish to NuGet

# Packs the three packable projects and pushes them to nuget.org via trusted
# publishing (OIDC) — no long-lived API key.
#
# Three jobs, so that nothing which runs project code ever holds the publishing credential:
#   build    read-only token. Checks the tag is a commit of main, restores, builds, tests and packs, and uploads
#            the .nupkg files as an artifact. (A restore can run MSBuild targets from packages: that is project code.)
#   publish  the only job with `id-token: write`. It restores nothing: it downloads the packages built above,
#            logs in with NuGet trusted publishing and pushes those exact files. It runs in the `nuget-publish`
#            environment, so add required reviewers there (Settings > Environments).
#   release  creates the GitHub Release (`contents: write`).
#
# Runs on a pushed v* tag, or manually (Actions > Publish to NuGet > Run workflow) with the version typed in.
# `dry_run` runs the build job only (nothing is pushed, no release): use it to rehearse a release from main.
#
# One-time setup:
#   - nuget.org > Account > Trusted Publishing: add a policy —
#       Repository owner: inandusolutions
#       Repository:       inandu-grid-extensions
#       Workflow file:    publish.yml
#       Packages / glob:  Inandu.Grid.Extensions*
#   - GitHub > Settings > Secrets and variables > Actions > Variables:
#       NUGET_USER = the nuget.org account/org that owns the packages
#   - GitHub > Settings > Environments > nuget-publish: required reviewers.
#
# Release flow (see docs/publishing.md): bump <Version> in the three src/**/*.csproj,
# move the CHANGELOG notes, commit, merge, then `git tag vX.Y.Z && git push origin vX.Y.Z` from main.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish — must match <Version> in the csprojs (e.g. 0.3.0)'
        required: true
      dry_run:
        description: 'Build, test and pack only: do not push and do not create a release'
        type: boolean
        default: false

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

jobs:
  build:
    # Release tag or main only: a manual run from any other branch is skipped.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0          # the ancestry check below needs main's history
          persist-credentials: false

      # A tag can be pushed on any commit by anyone with write access: only a commit of main may publish.
      - name: The commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not a commit of main. Release tags must be cut from main."
            exit 1
          fi

      - name: Set up .NET (8 + 10 runtimes, 11 SDK)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            8.x
            10.x
            11.x

      - name: Resolve version
        id: ver
        env:
          # Passed through the environment, never interpolated into the script.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a SemVer version (x.y.z or x.y.z-prerelease)."
            exit 1
          fi
          CSPROJ_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/Inandu.Grid.Extensions/Inandu.Grid.Extensions.csproj)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publishing=$VERSION  csproj=$CSPROJ_VERSION"
          if [ "$VERSION" != "$CSPROJ_VERSION" ]; then
            echo "::error::Version $VERSION does not match <Version>$CSPROJ_VERSION in the core csproj — bump src/**/*.csproj first."
            exit 1
          fi

      - name: Restore
        run: dotnet restore Inandu.Grid.Extensions.sln

      - name: Build
        run: dotnet build Inandu.Grid.Extensions.sln -c Release --no-restore

      - name: Test (net8.0 + net10.0 + net11.0)
        run: dotnet test Inandu.Grid.Extensions.sln -c Release --no-build

      - name: Pack
        run: dotnet pack Inandu.Grid.Extensions.sln -c Release --no-build -o ./artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    environment: nuget-publish
    permissions:
      id-token: write   # NuGet trusted publishing: the only job that has it
    steps:
      - name: Set up .NET SDK (for `dotnet nuget push` only)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.x

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages
          path: artifacts

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push (core first, then the companions)
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for pkg in $(ls ./artifacts/*.nupkg | sort); do
            echo "pushing $pkg"
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The release notes come from the CHANGELOG.md section for this version when there is one,
      # otherwise GitHub generates them from the merged PRs since the previous tag.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists"; exit 0; fi
          NOTES=""
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v v="$VERSION" 'BEGIN{p=0} /^## \[/{ if (p) exit; if (index($0,"## [" v "]")==1) {p=1; next} } p{print}' CHANGELOG.md)
          fi
          if [ -n "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
