name: Publish to NuGet

# Fires when a v* tag is pushed. Packs the three packable projects and pushes them
# to nuget.org via trusted publishing (OIDC) — no long-lived API key.
#
# One-time setup on the repo:
#   - nuget.org: create a Trusted Publisher policy for this repo + workflow file
#     (Repository owner: inandusolutions, Repository: inandu-grid-extensions,
#      Workflow file: publish.yml).
#   - GitHub: Settings > Secrets and variables > Actions > Variables >
#     NUGET_USER = the nuget.org account/org that owns the packages.
#
# Release flow (see docs/publishing.md): bump <Version> in the three src/**/*.csproj,
# move the CHANGELOG notes, commit, then `git tag vX.Y.Z && git push --tags`.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # required for NuGet trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET (8 runtime + 10 SDK)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Resolve version from the tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CSPROJ_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/Inandu.Grid.Extensions/Inandu.Grid.Extensions.csproj)
          echo "tag=$VERSION  csproj=$CSPROJ_VERSION"
          if [ "$VERSION" != "$CSPROJ_VERSION" ]; then
            echo "::error::Tag v$VERSION does not match <Version>$CSPROJ_VERSION in the core csproj — bump the src/**/*.csproj first."
            exit 1
          fi

      - name: Restore
        run: dotnet restore Inandu.Grid.Extensions.sln

      - name: Build
        run: dotnet build Inandu.Grid.Extensions.sln -c Release --no-restore

      - name: Test (net8.0 + net10.0)
        run: dotnet test Inandu.Grid.Extensions.sln -c Release --no-build

      - name: Pack
        run: dotnet pack Inandu.Grid.Extensions.sln -c Release --no-build -o ./artifacts

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push (core first, then the companions)
        run: |
          for pkg in $(ls ./artifacts/*.nupkg | sort); do
            echo "pushing $pkg"
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
