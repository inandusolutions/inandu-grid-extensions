name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET (8 + 10 + 11)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            8.x
            10.x
            11.x

      - run: dotnet restore Inandu.Grid.Extensions.sln

      - name: Build
        run: dotnet build Inandu.Grid.Extensions.sln -c Release --no-restore

      - name: Test (net8.0 + net10.0 + net11.0)
        run: dotnet test Inandu.Grid.Extensions.sln -c Release --no-build

      - name: Vulnerable packages (direct + transitive)
        run: |
          dotnet list Inandu.Grid.Extensions.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found - see the log above."
            exit 1
          fi

      - name: Pack (API compatibility check against the last release)
        # EnablePackageValidation + PackageValidationBaselineVersion fail the pack on a breaking
        # public-API change. Needs the .NET 11 SDK so all three target frameworks are produced.
        run: dotnet pack Inandu.Grid.Extensions.sln -c Release --no-build -o ./artifacts
  # The same EF Core tests as above, against real servers instead of in-memory SQLite. They pick the
  # provider from INANDU_TEST_PROVIDER / INANDU_TEST_CONNECTION (see ShopFixture); each fixture
  # creates and drops its own database.
  ef-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      INANDU_TEST_PROVIDER: postgres
      INANDU_TEST_CONNECTION: Host=localhost;Port=5432;Username=postgres;Password=pw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            8.x
            10.x
            11.x
      # Npgsql has no EF Core 11 release yet, so postgres runs on net8.0 and net10.0 only.
      - run: dotnet test tests/Inandu.Grid.Extensions.EntityFrameworkCore.Tests -c Release -f net8.0
      - run: dotnet test tests/Inandu.Grid.Extensions.EntityFrameworkCore.Tests -c Release -f net10.0

  ef-sqlserver:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Inandu_Pw1234
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Inandu_Pw1234 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      INANDU_TEST_PROVIDER: sqlserver
      INANDU_TEST_CONNECTION: Server=localhost,1433;User Id=sa;Password=Inandu_Pw1234;TrustServerCertificate=True;Encrypt=False
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            8.x
            10.x
            11.x
      - run: dotnet test tests/Inandu.Grid.Extensions.EntityFrameworkCore.Tests -c Release

  # MySQL 8.4 (Pomelo targets EF Core 9, so this runs on net8.0 only). Locally the same tests start their own
  # container with Testcontainers: INANDU_TEST_PROVIDER=mysql dotnet test tests/Inandu.Grid.Extensions.EntityFrameworkCore.Tests -f net8.0
  ef-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INANDU_TEST_PROVIDER: mysql
      INANDU_TEST_CONNECTION: Server=127.0.0.1;Port=3306;User ID=root;Password=pw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            8.x
            10.x
      - run: dotnet test tests/Inandu.Grid.Extensions.EntityFrameworkCore.Tests -c Release -f net8.0
