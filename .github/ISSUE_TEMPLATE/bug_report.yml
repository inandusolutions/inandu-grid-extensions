name: Bug report
description: Something in Inandu.Grid.Extensions doesn't work as documented
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first.
        For security issues, do **not** file here — see `.github/SECURITY.md`.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - Inandu.Grid.Extensions (core)
        - Inandu.Grid.Extensions.EntityFrameworkCore
        - Inandu.Grid.Extensions.AspNetCore
        - Not sure
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: 0.3.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead? Include the exception and stack trace if there is one.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        The grid request (query string or JSON body), the `InanduGridOptions` you configured, and
        the shape of the data. A small failing test or repo is ideal. Issues without a reproduction
        may be closed.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Data source
      options:
        - IEnumerable<T> (in-memory)
        - IQueryable<T> over EF Core
        - IQueryable<T>, other provider
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: .NET / EF Core version
      placeholder: .NET 8.0.x, EF Core 8.0.11
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Generated SQL, logs, notes.
    validations:
      required: false
